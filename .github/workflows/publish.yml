name: Publish

# Releases used to happen from a laptop: deploy.sh prompted for a version, built
# whatever happened to be in the working tree, and ran `twine upload`. Nothing
# tied the artifact on PyPI to a reviewed commit — or to any commit at all,
# since the script wrote the version bump but never committed it.
#
# Publishing from a tag fixed the provenance but left the release itself manual,
# and the manual half is the half that failed. 0.3.2 was reviewed, merged, and
# stamped into version.txt on main — and never tagged. Nothing was built, PyPI
# went on serving 0.3.1, and the first sign of any of it was a red check on
# another repository's pull request, where prometheux-cli could not resolve the
# `>=0.3.2` floor it had just adopted. A release that can be silently skipped is
# reported by whoever depends on it next, which is too late and somewhere else.
#
# So the merge is the release. That is already what this repository says
# elsewhere: changelog-draft.yml drafts entries for a PR merged into main and
# ignores everything merged into develop, on the grounds that "the develop ->
# main merge is the release". Publishing now agrees with it. The guard job reads
# version.txt and stops the run when that version is already tagged, so an
# ordinary merge that does not bump the version is a no-op.
#
# Provenance is not weakened by dropping the tag trigger — it is enforced
# earlier. The two checks that used to guard the build asked whether the tag
# matched version.txt and whether its commit had reached main; neither question
# can be answered wrongly now, because the version *is* version.txt and the only
# commits this trigger can build are on main. The tag is still created, after a
# successful upload rather than before the build, which additionally means a
# failed publish can be re-run instead of needing the tag deleted first.
#
# One workflow rather than "merge creates a tag, tag triggers publish", because a
# tag pushed with the default GITHUB_TOKEN does not start another workflow run.
# The two-file version would need a stored PAT — a long-lived secret this
# repository otherwise does not have, and the reason Trusted Publishing is used
# below. prometheux-cli's release.yml arrived at the same arrangement for the
# same reason.
on:
  push:
    branches: [main]

concurrency:
  # Never abort a run half-way: cancelling between the upload and the tag leaves
  # a version on PyPI with nothing in git recording that it shipped.
  group: publish-main
  cancel-in-progress: false

# The guard and build jobs need nothing beyond reading the checkout. A job-level
# block replaces this one rather than adding to it, so the publish job below
# still ends up with id-token as its only permission, and the tag job with
# contents.
permissions:
  contents: read

jobs:
  guard:
    # Decides whether this push is a release at all. Most pushes to main are not:
    # they change code without bumping version.txt, and re-running the build for
    # them would either publish a duplicate — which PyPI refuses — or need a
    # skip-existing flag that would hide a genuine version mistake.
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are the record of what has already shipped, and the default
          # shallow fetch does not bring them.
          fetch-depth: 0

      - id: check
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          if [ -z "$version" ]; then
            echo "::error::version.txt is empty; setup.py stamps it into the package, so there is no version to release."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(git tag -l "v$version")" ]; then
            echo "v$version is already tagged — this push released nothing."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is not tagged yet — releasing it."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.should_publish == 'true'
    # Deliberately holds no `id-token` permission. This job installs
    # dependencies and builds the distributions — third-party code — and PyPI's
    # guidance is to keep all of that out of any job able to mint a publishing
    # token. A malicious dependency here can waste a release; it cannot ask for
    # a credential.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The floor of python_requires, so a release cannot ship syntax the
          # oldest supported interpreter rejects.
          python-version: "3.9"
          # No pip cache, for the same reason as CI: a customer installing today
          # resolves from scratch, so the release check must too.

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . build twine

      - name: Report resolved dependency versions
        run: pip freeze

      - name: Import the package
        # CI already did this for the commit, but dependency resolution moves
        # under a fixed commit — that is exactly how the `mcp` 2.0.0 break
        # arrived — and a release is the last moment a red check is still free.
        run: |
          python - <<'PY'
          import prometheux_chain as pc

          expected = ("list_concepts", "run_concept", "save_ontology", "agent_chat", "config")
          missing = [name for name in expected if not hasattr(pc, name)]
          if missing:
              raise SystemExit(f"public API is missing: {missing}")
          print("import OK, version", pc.__version__)
          PY

      - name: Check the built version is the one the guard decided to release
        # setup.py reads version.txt at build time, so these agree by
        # construction — unless the working tree the build saw differs from the
        # one the guard read, which is the failure this catches before an
        # artifact reaches PyPI under the wrong name.
        env:
          EXPECTED: ${{ needs.guard.outputs.version }}
        run: |
          built="$(python -c 'import prometheux_chain; print(prometheux_chain.__version__)')"
          if [ "$built" != "$EXPECTED" ]; then
            echo "::error::guard resolved $EXPECTED but the package reports $built."
            exit 1
          fi
          echo "Building $built."

      - name: Build
        run: |
          rm -rf build dist ./*.egg-info
          python -m build

      - name: Check the artifacts
        run: |
          twine check dist/*
          ls -l dist/

      - name: Record what this release contains (SBOM + checksums)
        # Under artifacts/, never dist/: the publish job uploads everything in
        # dist/ to PyPI, and an SBOM is not a distribution.
        #
        # The SBOM describes a clean install of the built wheel rather than this
        # job's environment, which also holds build and twine. install_requires
        # pins nothing, so the resolved transitive versions captured here are the
        # only record of what someone installing this version actually received —
        # which is the question asked after a dependency turns out to be bad, and
        # `pip freeze` in a log that expires does not answer it.
        run: |
          mkdir -p artifacts
          python -m venv /tmp/sbom-env
          /tmp/sbom-env/bin/pip install --upgrade pip
          /tmp/sbom-env/bin/pip install dist/*.whl
          pip install cyclonedx-bom
          cyclonedx-py environment /tmp/sbom-env \
            --output-format JSON --output-file artifacts/sbom.cyclonedx.json
          sha256sum dist/* artifacts/sbom.cyclonedx.json > artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        # Separate from dist/ so the publish job can download the distributions
        # alone and hand PyPI exactly what belongs there.
        with:
          name: sbom
          path: artifacts/
          if-no-files-found: error

  publish:
    needs: [guard, build]
    if: needs.guard.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    # A trusted publisher is bound to this workflow's *filename*, not to a ref:
    # PyPI's half of the trust carries no branch constraint, so the trigger at
    # the top of this file is all that keeps a release on main — and a trigger
    # is one more line that anyone with write access can rewrite on a branch of
    # their own, where main's protection rules never see it.
    #
    # Two settings outside this file turn that into a real restriction, and
    # neither works without the other. The publisher registered on PyPI names
    # this environment, so a run that drops the key below mints a token with no
    # environment claim and PyPI refuses it; the environment's deployment branch
    # policy allows main only, so the key cannot be claimed from anywhere else.
    environment: pypi
    permissions:
      # PyPI verifies GitHub's signature on the token and matches its claims
      # against the registered publisher — repository and workflow filename — so
      # a copy of this file in another repository gets a token naming that
      # repository, which PyPI refuses. That binding to the filename is also why
      # this file is still publish.yml: renaming it would invalidate the
      # registered publisher and every upload with it.
      id-token: write
      # Signing the provenance statement below, and nothing else. Notably not
      # contents: the tag job holds that separately, so neither job can both
      # write to the repository and mint a publishing credential.
      attestations: write
    steps:
      # Still nothing here that runs code we did not write: no checkout, and no
      # dependency install, so no third-party package executes while the OIDC
      # token is in scope. Both actions below are first-party and install nothing.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        # Signs a statement that this workflow, at this commit, produced these
        # exact files, and records it in a public transparency log. Not a
        # duplicate of the PEP 740 attestations gh-action-pypi-publish sends
        # below: those are verified through PyPI, whereas this one answers "did
        # prometheuxresearch build this?" about a wheel someone already has, via
        # `gh attestation verify`, without PyPI in the trust path.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        # No skip-existing: a version already on PyPI means version.txt is wrong,
        # and failing loudly is the point.
        uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    needs: [guard, publish]
    if: needs.guard.outputs.should_publish == 'true'
    # Last, so that the tag means "this version is on PyPI" rather than "someone
    # intended to release this". It is also what the guard reads on the next
    # push, so a run that fails before the upload leaves nothing behind and can
    # simply be re-run.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag the released commit
        # Plain git rather than a release action: this is the one job that can
        # write to the repository, and the less third-party code runs inside it
        # the better. Nothing listens for tags any more, so this pushes a record,
        # not a trigger.
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "prometheux_chain $VERSION"
          git push origin "v$VERSION"

      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: artifacts/

      - name: Publish the GitHub Release
        # Somewhere to put the SBOM and the checksums: PyPI stores neither, and
        # an artifact from this run expires. The release is attached to the tag
        # pushed above, which is why this step follows it.
        #
        # gh rather than a release action, for the same reason the tag uses plain
        # git — gh is preinstalled on the runner and adds no third-party code to
        # the one job that can write here.
        #
        # --generate-notes because this repository keeps no CHANGELOG.md; the
        # user-facing changelog is drafted into the changelog repository by
        # changelog-draft.yml, so these notes are the commit-level record.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            artifacts/sbom.cyclonedx.json \
            artifacts/SHA256SUMS
