name: CI

# This SDK is pip-installed by customers and by our own notebooks, and it had no
# CI at all. Its sibling px-mcp-server was broken for two weeks by exactly the
# gap that leaves: an uncapped dependency resolved to a new major (`mcp` 2.0.0,
# released 2026-07-28), every fresh install failed on import, and nobody noticed
# because nothing installed it from scratch on a schedule. The dependencies here
# are uncapped too, so the same thing can happen to `requests`, `pyyaml` or
# `websocket-client`.
on:
  # Work on a branch is already covered by the pull_request run, so listing
  # develop here only bought a second identical set of checks on the same
  # commit. push stays for main so the merge commit itself is checked.
  push:
    branches: [main]
  pull_request:
  # Dependency resolution can break with no commit of ours, which is how the
  # break above arrived. A weekly run finds it while it is still a red check
  # rather than a customer's traceback.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Nothing here writes to the repository — it installs, imports and builds — so
# the token these jobs hand to every third-party action and dependency should
# not be able to either. Without this it inherits the repository default, which
# may be read/write.
permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes whatever is still running for it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import:
    # Not called "test": there is no test suite in this repo (test/ holds
    # notebooks and fixtures). Importing the package is still a real check
    # rather than a formality — __init__.py re-exports ~140 names from every
    # submodule, so a syntax error, a missing dependency or a function renamed
    # anywhere in the package surfaces right here.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # setup.py claims >=3.9; check both ends of that range rather than
        # trusting the classifier.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # No pip cache on purpose: a customer installing today resolves from
          # scratch, so CI must too, or it will not see a new major until they do.

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Report resolved dependency versions
        run: pip freeze

      - name: Import the package
        run: |
          python - <<'PY'
          import prometheux_chain as pc

          expected = ("list_concepts", "run_concept", "save_ontology", "agent_chat", "config")
          missing = [name for name in expected if not hasattr(pc, name)]
          if missing:
              raise SystemExit(f"public API is missing: {missing}")

          public = [name for name in dir(pc) if not name.startswith("_")]
          print(f"import OK: {len(public)} public names, version {pc.__version__}")
          PY

  install-from-built-package:
    # The wheel is what customers actually get. Building it and installing it in
    # a clean environment is the only check that covers packaging mistakes and
    # dependency resolution together — an editable install can hide both, and it
    # is where a missing package_data entry (config.yaml) would show up.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl

      - name: Report what a customer would get
        run: /tmp/fresh/bin/pip freeze

      - name: Import from outside the source tree
        # Run from /tmp so the installed package is what gets imported, not the
        # working copy sitting in the checkout directory.
        working-directory: /tmp
        run: |
          /tmp/fresh/bin/python - <<'PY'
          import prometheux_chain as pc

          public = [name for name in dir(pc) if not name.startswith("_")]
          print(f"installed import OK: {len(public)} public names, version {pc.__version__}")
          PY

  secrets:
    name: secret scan (gitleaks, full history)
    # This repository is public, and releases used to be built and uploaded from
    # laptops, so a credential that reached a commit here is the kind of thing
    # that would have arrived by accident rather than by design. Deleting one
    # from HEAD does not unpublish it either: the old commit stays fetchable, so
    # the fix is a history rewrite plus a rotation. Scanning the whole history
    # rather than the checkout is therefore the only version of this check worth
    # running. prometheux-cli gates on the same job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks walks the commit graph; the default shallow fetch would
          # leave it with one commit to look at.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VER=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan
        # --redact: a finding must not reprint the secret into a log that is as
        # public as the repository.
        run: gitleaks git . --redact --verbose
